<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Visor Muestra Apurímac - Supervisión ALP</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body,#map{width:100%;height:100%;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#e5e7eb}
#map{position:absolute;inset:0}
.leaflet-container{font-size:13px}

.leaflet-control-layers{
  border-radius:10px!important;
  box-shadow:0 3px 14px rgba(0,0,0,.22)!important;
  border:1px solid #d1d5db!important;
}
.leaflet-control-layers-expanded{
  padding:8px 10px!important;
  min-width:165px;
  max-width:205px;
  font-size:12px;
}

.mobile-toolbar{
  position:fixed;z-index:1001;left:50%;bottom:44px;
  transform:translateX(-50%);pointer-events:none;
}
.route-main{
  pointer-events:auto;min-width:185px;height:48px;border:2px solid #fff;border-radius:24px;
  padding:0 18px;background:#166534;color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.30);
  font-weight:900;font-size:12px;cursor:pointer;
}
.route-main:disabled{opacity:.78;cursor:wait}
.route-main:active{transform:scale(.98)}

.route-info{
  position:fixed;z-index:1001;left:50%;bottom:103px;transform:translateX(-50%);
  max-width:82vw;background:rgba(15,23,42,.94);color:#fff;padding:7px 10px;border-radius:9px;
  box-shadow:0 3px 12px rgba(0,0,0,.25);font-size:10px;font-weight:700;text-align:center;display:none;
}

/* Globos: PRINCIPAL rojo / ALTERNATIVA azul */
.pin-wrap{position:relative;width:38px;height:45px}
.pin-balloon{
  position:absolute;left:3px;top:1px;width:32px;height:32px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(15,23,42,.45),0 3px 10px rgba(0,0,0,.28);
}
.pin-balloon.principal{background:#ef4444}
.pin-balloon.alternativa{background:#2563eb}
.pin-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:rotate(45deg);color:#fff;font-weight:900;font-size:10px;
}

.me-marker{
 width:22px;height:22px;border-radius:50%;background:#16a34a;border:4px solid white;
 box-shadow:0 0 0 3px rgba(22,163,74,.38),0 2px 8px rgba(0,0,0,.3)
}

.popup-card{min-width:225px;max-width:290px}
.popup-title{font-size:14px;font-weight:900;color:#0f172a;margin-bottom:5px}
.popup-system{font-size:11px;color:#475569;margin-bottom:7px}
.popup-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:10px;line-height:1.35}
.popup-grid .k{color:#64748b}
.popup-grid .v{font-weight:700;color:#1f2937}
.priority-alta{color:#b91c1c!important}
.priority-normal{color:#1d4ed8!important}
.popup-metric{
 margin-top:7px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:7px;
 padding:6px 7px;font-size:9px;line-height:1.35;color:#334155;
}
.popup-actions{display:flex;gap:6px;margin-top:8px}
.popup-actions a{
 text-decoration:none;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:800;
}
.gmaps{background:#0f172a;color:#fff}
.route-one{background:#166534;color:#fff}

.sed-tooltip{
 background:rgba(255,255,255,.96)!important;border:1px solid #cbd5e1!important;
 border-radius:6px!important;box-shadow:0 2px 7px rgba(0,0,0,.18)!important;
 color:#0f172a!important;font-size:10px!important;font-weight:800!important;padding:4px 6px!important;
}
.sed-tooltip:before{display:none!important}

.credit{
  position:fixed;z-index:1000;right:8px;bottom:6px;
  background:rgba(255,255,255,.88);color:#475569;border-radius:6px;
  padding:3px 6px;font-size:8px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.12);
  pointer-events:none;
}

@media(max-width:760px){
  .mobile-toolbar{bottom:36px}
  .route-main{min-width:190px;height:48px;font-size:12px}
  .leaflet-top.leaflet-right{top:6px;right:6px}
  .leaflet-control-layers-expanded{max-height:42vh;overflow:auto;max-width:190px}
  .leaflet-control-zoom{margin-top:7px!important;margin-left:7px!important}
  .credit{right:6px;bottom:5px;font-size:7px}
}
</style>
</head>

  preferCanvas:true

// SOLO ESRI
const esriStreet=L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  {minZoom:0,maxZoom:20,maxNativeZoom:18,attribution:'Esri'}
).addTo(map);

const esriSat=L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {minZoom:0,maxZoom:21,maxNativeZoom:19,attribution:'Esri World Imagery'}
);

const esriLabels=L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  {minZoom:0,maxZoom:21,maxNativeZoom:19,attribution:'Esri'}
);

const esriHybrid=L.layerGroup([esriSat,esriLabels]);

L.control.layers(
  {
    'Esri WorldStreetMap':esriStreet,
    'Esri Satélite':esriSat,
    'Esri Híbrido':esriHybrid
  },
  null,
  {position:'topright',collapsed:true,autoZIndex:true}
).addTo(map);

L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);

let myLocation=null;
let myMarker=null;
let accuracyCircle=null;
let routeLayer=null;

function esc(t){
  return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n,d=1){
  return Number(n).toLocaleString('es-PE',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pinIcon(s){
  const tipo=(s.tipo_muestra||'').toUpperCase()==='ALTERNATIVA'?'alternativa':'principal';
  return L.divIcon({
    className:'',
    html:`<div class="pin-wrap"><div class="pin-balloon ${tipo}"><span class="pin-num">${s.n}</span></div></div>`,
    iconSize:[38,45],iconAnchor:[19,43],popupAnchor:[0,-40]
  });
}
function googleUrl(s){
  if(myLocation){
    return `https://www.google.com/maps/dir/?api=1&origin=${myLocation.lat},${myLocation.lon}&destination=${s.lat},${s.lon}&travelmode=driving`;
  }
  return `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`;
}
function popupHTML(s){
  const pclass=s.prioridad==='ALTA'?'priority-alta':'priority-normal';
  return `<div class="popup-card">
    <div class="popup-title">SED ${esc(s.sed)}</div>
    <div class="popup-system">${esc(s.sistema)} · ${esc(s.cod_sistema)}</div>
    <div class="popup-grid">
      <span class="k">Muestra</span><span class="v">${esc(s.tipo_muestra)}</span>
      <span class="k">Prioridad</span><span class="v ${pclass}">${esc(s.prioridad)}</span>
      <span class="k">Desviación</span><span class="v">${fmt(s.desviacion,1)} %</span>
      <span class="k">Criterio</span><span class="v">${esc(s.criterio)}</span>
    </div>
    <div class="popup-metric">
      <b>P1 teórico:</b> ${fmt(s.consumo_p1,0)} kWh &nbsp;·&nbsp;
      <b>Promedio medido:</b> ${fmt(s.promedio,1)} kWh
    </div>
    <div class="popup-actions">
      <a class="route-one" href="#" onclick="event.preventDefault();routeTo('${s.sed}')">Ruta</a>
      <a class="gmaps" target="_blank" href="${googleUrl(s)}">Google Maps</a>
    </div>
  </div>`;
}

DATA.forEach(s=>{
  L.marker([s.lat,s.lon],{icon:pinIcon(s)})
    .addTo(map)
    .bindPopup(popupHTML(s),{maxWidth:310})
    .bindTooltip(`SED ${s.sed} · ${s.sistema}`,{className:'sed-tooltip',sticky:true});
});

const bounds=L.latLngBounds(DATA.map(s=>[s.lat,s.lon]));
map.fitBounds(bounds,{padding:[35,35]});

function ensureLocation(cb){
  if(myLocation){cb();return}
  if(!navigator.geolocation){
    alert('Este navegador no admite geolocalización.');
    return;
  }
  const btn=document.getElementById('routeAllBtn');
  if(btn){btn.disabled=true;btn.textContent='📍 Obteniendo ubicación...';}
  navigator.geolocation.getCurrentPosition(pos=>{
    myLocation={lat:pos.coords.latitude,lon:pos.coords.longitude};
    if(myMarker)map.removeLayer(myMarker);
    if(accuracyCircle)map.removeLayer(accuracyCircle);
    myMarker=L.marker([myLocation.lat,myLocation.lon],{
      icon:L.divIcon({className:'',html:'<div class="me-marker"></div>',iconSize:[22,22],iconAnchor:[11,11]})
    }).addTo(map).bindTooltip('Mi ubicación');
    accuracyCircle=L.circle([myLocation.lat,myLocation.lon],{
      radius:pos.coords.accuracy,color:'#16a34a',weight:1,fillOpacity:.05
    }).addTo(map);
    if(btn){btn.disabled=false;btn.textContent='🧭 Ruta sugerida';}
    cb();
  },()=>{
    if(btn){btn.disabled=false;btn.textContent='🧭 Ruta sugerida';}
    alert('No se pudo obtener tu ubicación. Abre el visor desde GitHub Pages y permite el acceso a ubicación.');
  },{enableHighAccuracy:true,timeout:15000,maximumAge:3000});
}

async function fetchRoute(points){
  const coords=points.map(p=>`${p.lon},${p.lat}`).join(';');
  const url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const res=await fetch(url,{signal:ctrl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const obj=await res.json();
    if(!obj.routes||!obj.routes.length)throw new Error('Sin ruta');
    return obj.routes[0];
  } finally {
    clearTimeout(timer);
  }
}
function showRouteInfo(txt){
  const el=document.getElementById('routeInfo');
  el.textContent=txt;el.style.display='block';
}
function clearRoute(){
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}
  document.getElementById('routeInfo').style.display='none';
}
async function drawRoute(points,label){
  clearRoute();
  try{
    const r=await fetchRoute(points);
    routeLayer=L.geoJSON(r.geometry,{style:{color:'#16a34a',weight:5,opacity:.9}}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[35,35]});
    const km=(r.distance/1000).toFixed(1);
    const min=Math.round(r.duration/60);
    showRouteInfo(`${label} · ${km} km · ${min} min aprox.`);
  }catch(e){
    routeLayer=L.polyline(points.map(p=>[p.lat,p.lon]),{color:'#f59e0b',weight:4,dashArray:'8 7'}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[35,35]});
    showRouteInfo('Ruta vial no disponible; se muestra referencia directa.');
  }
}
function routeTo(sed){
  const s=DATA.find(x=>x.sed===sed);
  if(!s)return;
  ensureLocation(()=>drawRoute([myLocation,s],`Ruta a SED ${s.sed}`));
}
function hav(a,b){
  const R=6371008.8,rad=x=>x*Math.PI/180;
  const p1=rad(a.lat),p2=rad(b.lat),dp=rad(b.lat-a.lat),dl=rad(b.lon-a.lon);
  const z=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(z));
}
function routeAll(){
  ensureLocation(()=>{
    let cur=myLocation;
    const pending=[...DATA];
    const order=[];
    while(pending.length){
      let bi=0,bd=Infinity;
      pending.forEach((s,i)=>{
        const d=hav(cur,s);
        if(d<bd){bd=d;bi=i}
      });
      const s=pending.splice(bi,1)[0];
      order.push(s);
      cur=s;
    }
    drawRoute([myLocation,...order],`Ruta sugerida · ${DATA.length} SED`);
  });
}
